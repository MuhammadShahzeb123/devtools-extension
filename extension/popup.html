<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body   { font-family: system-ui, sans-serif; padding: 14px 16px; min-width: 220px; margin: 0; }
    .row   { display: flex; align-items: center; gap: 8px; }
    .dot   { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .on    { background: #22c55e; }
    .off   { background: #ef4444; }
    .paused-dot { background: #f59e0b; }
    .label { font-size: 14px; color: #111; font-weight: 500; }
    .sub   { margin-top: 6px; font-size: 12px; color: #6b7280; }
    .btn   {
      margin-top: 10px; width: 100%; padding: 6px 0;
      border: 1px solid #d1d5db; border-radius: 6px;
      background: #f9fafb; font-size: 13px; color: #374151;
      cursor: pointer; font-family: inherit;
    }
    .btn:hover { background: #f3f4f6; }
    .btn.pause { border-color: #fca5a5; color: #dc2626; background: #fff5f5; }
    .btn.pause:hover { background: #fee2e2; }
    .btn.resume { border-color: #86efac; color: #16a34a; background: #f0fdf4; }
    .btn.resume:hover { background: #dcfce7; }
  </style>
</head>
<body>
  <div class="row">
    <div class="dot" id="dot"></div>
    <span class="label" id="label">...</span>
  </div>
  <div class="sub" id="sub"></div>
  <button class="btn" id="btn" style="display:none"></button>
  <script src="popup.js"></script>
</body>
</html>
